<!DOCTYPE html>
<html>

<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link rel="shortcut icon" href="images/artist.png" type="">

  <title>Art Creation</title>

  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />

  <!-- fonts style -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />

  <style>
    .card-container {
      display: flex;
      flex-direction: column; /* Stack images vertically */
      align-items: center; /* Center-align images horizontally */
      padding: 20px;
    }

    .card-content {
      width: 100%; /* Make the card span the full width */
      max-width: 800px; /* Optional: Limit the maximum width of the image */
      margin-bottom: 20px; /* Space between images */
      border: none; /* Remove borders */
      border-radius: 0; /* Remove rounded corners */
      box-shadow: none; /* Remove box shadow */
      overflow: hidden; /* Ensure image fits within the container */
    }

    .card-content img {
      width: 100%; /* Make the image fill the card width */
      height: auto; /* Maintain aspect ratio */
      object-fit: cover; /* Ensure image covers the area */
    }
  </style>

</head>

<body class="sub_page">

  <div class="hero_area">

    <div class="hero_bg_box">
      <div class="bg_img_box">
        <img src="images/bg.gif" alt="">
      </div>
    </div>

    <!-- header section starts -->
    <header class="header_section">
      <div class="container-fluid">
        <nav class="navbar navbar-expand-lg custom_nav-container ">
          <a class="navbar-brand" href="index.html">
            <span>
              <img src="images/artist.png" alt="" style="width:70px;">
              Art Creation
            </span>
          </a>

          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class=""> </span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav  ">
              <li class="nav-item ">
                <a class="nav-link" href="index.html">Home </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html"> About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="service.html">Services <span class="sr-only">(current)</span> </a>
              </li>
              <li class="nav-item active">
                <a class="nav-link" href="paintings.html">Paintings</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="team.html">Contact us</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>
    <!-- end header section -->
  </div>

  <div class="card-container" id="cardContainer" style="scrollbar-width: thin; height: 100vh; overflow-y: auto; margin-bottom:200px; padding-bottom: 200px; background: linear-gradient(130deg, #5a5032, #0f054c);">
    <!-- Cards will be dynamically inserted here -->
  </div>

  <!-- footer section -->
  <audio id="snapSound" src="song/soundclick.mp3" preload="auto"></audio>
  <div class="elfsight-app-95b7146c-3981-4142-82f5-9ae7d470af86" data-elfsight-app-lazy></div>

  <!-- jQery -->
  <script type="text/javascript" src="js/jquery-3.4.1.min.js"></script>
  <!-- popper js -->
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <!-- bootstrap js -->
  <script type="text/javascript" src="js/bootstrap.js"></script>
  <!-- custom js -->
  <script type="text/javascript" src="js/custom.js"></script>
  <script src="https://static.elfsight.com/platform/platform.js" async></script>

  <script>
    // Array of images (no titles or descriptions)
    const artworks = [
      { image: 'imagesToshow/pic1.jpg' },
      { image: 'imagesToshow/pic2.jpg' },
      { image: 'imagesToshow/pic3.jpg' },
      // Add more artworks as needed
    ];

    // Function to create and display images
    function displayArtworks() {
      const container = document.getElementById('cardContainer');
      artworks.forEach(art => {
        const card = document.createElement('div');
        card.innerHTML = `
          <div class="card-content">
            <img src="${art.image}" alt="Artwork">
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Call the function to display the artworks
    displayArtworks();

    // Function to play the snap sound
    function playSnap() {
      const snapSound = document.getElementById('snapSound');
      snapSound.currentTime = 0; // Rewind to the start
      snapSound.play(); // Play the sound
    }

    // Attach click event listener to the whole document
    document.addEventListener('click', playSnap);
  </script>
</body>

</html>
